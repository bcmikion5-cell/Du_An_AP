        header p { font-size: 13px; opacity: 0.9; }

        .result-count { font-size: 14px; color: #666; margin-bottom: 12px; }

        .location-list { display: flex; flex-direction: column; gap: 15px; }

        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.08); border: 1px solid #eee; border-top: 4px solid #0056b3; }
        .card-img { width: 100%; height: 210px; object-fit: cover; display: block; background-color: #e0e0e0; }
        .card-body { padding: 15px; }
        .card h3 { font-size: 18px; line-height: 1.3; color: #0056b3; margin-bottom: 6px; }

        .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .badge { background: #e3f2fd; color: #0d47a1; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
        .badge-ap { background: #fff3cd; color: #856404; }

        .info-item { font-size: 14px; word-break: break-word; color: #444; margin-bottom: 5px; display: flex; align-items: flex-start; gap: 6px; line-height: 1.4; }
        .desc { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.4; }

        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; color: white; text-decoration: none; padding: 12px 8px; min-height: 46px; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; }
        .btn-maps { background-color: #28a745; }
        .btn-maps:active { background-color: #1e7e34; }

        // -------------------------------------------------------------------------
        // TẠO DANH SÁCH BỘ LỌC TỰ ĐỘNG TỪ DỮ LIỆU
        // -------------------------------------------------------------------------
        function fillSelect(selectId, values, labelFn) {
            const sel = document.getElementById(selectId);
            [...new Set(values)].sort((a, b) => a.localeCompare(b, 'vi')).forEach(v => {
                const opt = document.createElement('option');
                opt.value = v;
                opt.textContent = labelFn ? labelFn(v) : v;
                sel.appendChild(opt);
            });
        }

        fillSelect('apFilter', locations.map(l => l.ap), v => v === 'Cô Tô' ? 'Xã Cô Tô (chưa rõ ấp)' : v === 'Tà Đảnh' ? 'Xã Tà Đảnh' : 'Ấp ' + v);
        fillSelect('categoryFilter', locations.map(l => l.category));

        // -------------------------------------------------------------------------
        // HIỂN THỊ DANH SÁCH
        // -------------------------------------------------------------------------
        function renderLocations(data) {
            const listEl = document.getElementById('locationList');
            listEl.innerHTML = '';
            document.getElementById('resultCount').textContent = 'Hiển thị ' + data.length + '/' + locations.length + ' địa điểm';

            if (data.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">Không tìm thấy địa điểm phù hợp.</p>';
                return;
            }

            const getDisplayOrder = item => {
                const name = item.name.toLowerCase();
                if (name.includes('ủy ban nhân dân xã cô tô')) return 0;
                if (name.includes('mặt trận tổ quốc')) return 1;
                if (name.includes('công an xã')) return 2;
                if (name.includes('quân sự xã')) return 3;
                if (name.includes('trung tâm y tế')) return 4;
                if (name.includes('trung tâm văn hóa')) return 5;
                if (item.category === 'Cơ quan hành chính' && name.startsWith('văn phòng ấp')) return 6;
                if (item.category === 'Trường học') return 7;
                if (item.category === 'Cơ sở tôn giáo' && name.startsWith('chùa')) return 8;
                return 9;
            };

            [...data].sort((a, b) => getDisplayOrder(a) - getDisplayOrder(b)).forEach(item => {
                const apLabel = (item.ap === 'Cô Tô' || item.ap === 'Tà Đảnh') ? 'Xã ' + item.ap : 'Ấp ' + item.ap;
                const dirUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + item.latLng[0] + ',' + item.latLng[1];
                const card = document.createElement('div');
                card.className = 'card';
                const imgHtml = item.image
                    ? `<img src="${item.image}" alt="${item.name}" class="card-img" style="object-position:${item.imagePos || 'center'}" loading="lazy" onerror="this.style.display='none'">`
                    : '';
                card.innerHTML = `
                    ${imgHtml}
                    <div class="card-body">
                        <h3>${item.name}</h3>
                        <div class="badges">
                            <span class="badge badge-ap">📍 ${apLabel}</span>
                            <span class="badge">${item.category}</span>
                        </div>
                        <div class="info-item">🏠 <span><strong>Địa chỉ:</strong> ${item.address}</span></div>
                        <div class="info-item">🧭 <span><strong>Tọa độ:</strong> ${item.coords}</span></div>
                        <p class="desc">${item.shortDesc}</p>
                        <div class="btn-row">
                            <a href="${item.mapUrl}" target="_blank" rel="noopener" class="btn btn-maps">🗺️ Xem bản đồ</a>
                            <a href="${dirUrl}" target="_blank" rel="noopener" class="btn btn-dir">➡️ Chỉ đường</a>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // -------------------------------------------------------------------------
        // LỌC VÀ TÌM KIẾM
        // -------------------------------------------------------------------------
        function filterData() {
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedAp = document.getElementById('apFilter').value;
            const selectedCategory = document.getElementById('categoryFilter').value;

            const filtered = locations.filter(item => {
                const matchText = item.name.toLowerCase().includes(searchText) ||
                                  item.category.toLowerCase().includes(searchText) ||
                                  item.shortDesc.toLowerCase().includes(searchText);
                const matchAp = selectedAp === "" || item.ap === selectedAp;
                const matchCategory = selectedCategory === "" || item.category === selectedCategory;
                return matchText && matchAp && matchCategory;
            });

            renderLocations(filtered);
        }

        renderLocations(locations);
    </script>
